mcts:
  max_rollouts: 4           # Số lượng rollouts cho MVP (gốc: 16)
  max_children: 3           # Số nhánh con tối đa từ 1 node
  c_base: 10.0              # Hyperparameter c_base trong P-UCB (RethinkMCTS Eq. 2)
  c: 4.0                    # Trọng số khám phá UCB (RethinkMCTS Eq. 2)
  reward_a: 0.8             # Trọng số test pass rate (RethinkMCTS Eq. 3)
  reward_b: 0.2             # Trọng số LLM self-eval (RethinkMCTS Eq. 3)

sandbox:
  timeout: 2.0              # Giới hạn thời gian chạy cho 1 test case (giây)
  memory_limit_mb: 512      # Giới hạn RAM

model:
  model_name: "qwen2.5-coder:7b"
  api_base: "http://localhost:11434/v1"   # Trỏ trực tiếp tới Ollama cục bộ
  api_key: "ollama"
  temperature: 0.7
  max_tokens: 1536

data:
  dataset_name: "deepmind/code_contests"
  default_difficulty: "EASY"
