# Use --dry-run until the serving environment and development cohort are pinned.
# Existing APPS test data are exploratory, never a fresh development split.
profile: research_foundation
model:
  transport: openai_compatible
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen2.5-Coder-3B-Instruct
  revision: null
  api_key_env: MODEL_API_KEY
  max_transport_retries: 0
  require_exact_token_count: true
prompts:
  bundle: compact_v1
sampling:
  code: {temperature: 0.2, top_p: 0.95, max_output_tokens: 1536}
  expansion: {temperature: 0.6, top_p: 0.95, max_output_tokens: 384}
  rethink: {temperature: 0.3, top_p: 0.95, max_output_tokens: 256}
  critic: {temperature: 0.0, top_p: 1.0, max_output_tokens: 160}
  block_analysis: {temperature: 0.0, top_p: 1.0, max_output_tokens: 768}
search:
  width: 3
  max_depth: 4
  max_rethinks_per_node: 2
  early_stop: public_all_passed
feedback:
  mode: adaptive
  escalate_after: 1
reward:
  policy: dual
budget:
  max_code_generations: 8
  max_model_calls: 64
  max_search_iterations: 64
  max_total_tokens: 65536
  max_wall_seconds: 600
execution:
  backend: docker
  image: rethink-worker:py311
data:
  adapter: apps
  prepared_public_path: prepared/apps_v2/public/problems.jsonl
  judge_suites_dir: prepared/apps_v2/judge/suites
  split: test
experiment:
  stage: exploratory
  protocol_id: feedback-selection-v0
  seed: 42
  deviations:
    - small_code_models
    - compact_prompts
    - first_two_public_remove_cross_split_duplicates
