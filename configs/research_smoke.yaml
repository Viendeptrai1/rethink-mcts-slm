# Offline functional check, not evidence of LLM quality.
profile: research_foundation
model:
  transport: mock
  model: deterministic-fixture
prompts:
  bundle: compact_v1
search:
  width: 2
  max_depth: 3
  max_rethinks_per_node: 2
  early_stop: public_all_passed
feedback:
  mode: adaptive
  escalate_after: 1
budget:
  max_code_generations: 8
  max_model_calls: 32
  max_search_iterations: 16
  max_wall_seconds: 60
execution:
  backend: trusted_fixture
data:
  adapter: synthetic
  prepared_public_path: tests/fixtures/benchmark/public.jsonl
  judge_suites_dir: tests/fixtures/benchmark/judge
experiment:
  stage: smoke
  protocol_id: feedback-selection-v0
  seed: 42
  allow_mock: true
