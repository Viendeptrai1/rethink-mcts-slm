[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rethink-mcts"
version = "0.1.0"
description = "RethinkMCTS: Refining Erroneous Thoughts in Monte Carlo Tree Search for Code Generation (evaluated on open 7-9B models, protocol v3.1)"
authors = [
    { name = "Kotori", email = "phanquocvien.123@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
datasets = [
    "datasets>=2.18.0",
]
serving = [
    "modal>=0.60.0",
    "openai>=1.20.0",
]

[project.scripts]
rethink = "rethink_mcts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
